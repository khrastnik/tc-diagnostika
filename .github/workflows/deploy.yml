name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Po selitvi na lastno domeno: nastavi spremenljivko repozitorija REDIRECT_TO (npr. https://toplolog.si)
      # in GitHub Pages bo namesto strani objavljal preusmeritve na isto pot na novi domeni.
      - if: ${{ vars.REDIRECT_TO != '' }}
        run: node scripts/build-redirects.mjs dist "${{ vars.REDIRECT_TO }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
